name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project FantaSensi.xcodeproj \
            -scheme FantaSensi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/FantaSensi.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FantaSensi.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FantaSensi-ipa
          path: ios/FantaSensi.ipa
          if-no-files-found: error
